<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070712" />
  <meta name="description" content="Jayden's week calendar — Hong Kong time" />
  <title>Calander — Welcome Jayden</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg: #070712;
      --bg-2: #0c0c1a;
      --surface: rgba(22, 22, 40, 0.78);
      --surface-solid: #161628;
      --surface-2: #1e1e36;
      --surface-hover: #262644;
      --text: #f7f7ff;
      --text-soft: #d0d0e6;
      --text-muted: #9494b0;
      --text-dim: #636380;
      --purple: #b39aff;
      --purple-deep: #8b6cff;
      --purple-glow: rgba(139, 108, 255, 0.4);
      --purple-soft: rgba(179, 154, 255, 0.18);
      --blue: #6eb6ff;
      --blue-deep: #4a9eff;
      --blue-soft: rgba(110, 182, 255, 0.16);
      --danger: #ff7a8a;
      --danger-soft: rgba(255, 122, 138, 0.16);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(179, 154, 255, 0.35);
      --today-ring: rgba(179, 154, 255, 0.65);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 22px;
      --radius-sm: 16px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      --tab-closed: clamp(112px, 28vw, 160px);
      --tab-open: min(92vw, 400px);
      --edge: max(14px, env(safe-area-inset-left, 0px));
      --edge-r: max(14px, env(safe-area-inset-right, 0px));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    html, body {
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 50% -15%, rgba(139, 108, 255, 0.32), transparent 58%),
        radial-gradient(ellipse 55% 45% at 110% 18%, rgba(74, 158, 255, 0.18), transparent 52%),
        radial-gradient(ellipse 50% 40% at -10% 75%, rgba(179, 154, 255, 0.14), transparent 48%),
        radial-gradient(ellipse 40% 30% at 70% 100%, rgba(59, 130, 246, 0.1), transparent 50%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 45%, #06060e 100%);
      padding:
        calc(20px + var(--safe-top))
        0
        calc(28px + var(--safe-bottom));
    }

    .shell {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 var(--edge);
    }

    .hero { margin-bottom: 8px; }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .welcome {
      font-size: clamp(30px, 7.5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
      background: linear-gradient(135deg, #fff 0%, #d4c4ff 45%, #9ec9ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand {
      margin-top: 8px;
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--purple);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 14px var(--purple-glow);
      flex-shrink: 0;
    }

    .tz-pill {
      flex-shrink: 0;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--purple);
      background: var(--purple-soft);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 8px 13px;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding: 11px 13px;
      background: rgba(22, 22, 40, 0.72);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }
    .nav-btn:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    .nav-btn:active { transform: scale(0.94); }
    .nav-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

    .week-label { text-align: center; flex: 1; min-width: 0; }
    .week-label .range {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .week-label .hint {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .today-jump {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--purple-deep), var(--blue-deep));
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--purple-glow);
      white-space: nowrap;
      display: block;
      margin: 14px auto 0;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .today-jump:active { transform: scale(0.97); }

    .hint-line {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    /* —— Full-bleed horizontal day tabs —— */
    .week-rail {
      margin-top: 18px;
      width: 100%;
      position: relative;
    }

    .week-tabs {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 6px var(--edge) 20px;
      min-height: 140px;
      cursor: grab;
      /* hide ugly native white scrollbar */
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    .week-tabs::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
      appearance: none !important;
      -webkit-appearance: none !important;
    }
    .week-tabs::-webkit-scrollbar-thumb,
    .week-tabs::-webkit-scrollbar-track,
    .week-tabs::-webkit-scrollbar-button,
    .week-tabs::-webkit-scrollbar-corner {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
      appearance: none !important;
      -webkit-appearance: none !important;
    }
    .week-tabs.is-dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      scroll-behavior: auto;
      user-select: none;
    }
    /* Do NOT disable pointer-events on day tabs — that broke mouse clicks.
       Clicks after a real drag are swallowed in JS instead. */

    .week-tabs.is-week-changing {
      pointer-events: none;
    }
    .week-tabs.week-drift-next .day-tab {
      animation: weekDriftIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .week-tabs.week-drift-prev .day-tab {
      animation: weekDriftInPrev 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .week-tabs.week-drift-next .day-tab:nth-child(1) { animation-delay: 0.00s; }
    .week-tabs.week-drift-next .day-tab:nth-child(2) { animation-delay: 0.03s; }
    .week-tabs.week-drift-next .day-tab:nth-child(3) { animation-delay: 0.06s; }
    .week-tabs.week-drift-next .day-tab:nth-child(4) { animation-delay: 0.09s; }
    .week-tabs.week-drift-next .day-tab:nth-child(5) { animation-delay: 0.12s; }
    .week-tabs.week-drift-next .day-tab:nth-child(6) { animation-delay: 0.15s; }
    .week-tabs.week-drift-next .day-tab:nth-child(7) { animation-delay: 0.18s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(1) { animation-delay: 0.00s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(2) { animation-delay: 0.03s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(3) { animation-delay: 0.06s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(4) { animation-delay: 0.09s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(5) { animation-delay: 0.12s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(6) { animation-delay: 0.15s; }
    .week-tabs.week-drift-prev .day-tab:nth-child(7) { animation-delay: 0.18s; }

    @keyframes weekDriftIn {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes weekDriftInPrev {
      from { opacity: 0; transform: translateX(-28px); }
      to { opacity: 1; transform: none; }
    }

    .day-tab {
      flex: 0 0 var(--tab-closed);
      width: var(--tab-closed);
      scroll-snap-align: center;
      scroll-snap-stop: normal;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        flex-basis 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.25s,
        box-shadow 0.25s,
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.25s;
      will-change: flex-basis, width;
    }

    .day-tab.is-open {
      flex: 0 0 var(--tab-open);
      width: var(--tab-open);
      border-color: var(--border-strong);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(179, 154, 255, 0.12);
    }

    .day-tab.is-today {
      border-color: var(--today-ring);
      box-shadow: 0 0 0 1px var(--today-ring), var(--shadow), 0 0 42px rgba(139, 108, 255, 0.2);
    }

    .day-tab.is-today.is-open {
      box-shadow: 0 0 0 1px var(--today-ring), 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 48px rgba(139, 108, 255, 0.28);
    }

    @media (min-width: 900px) {
      :root {
        --tab-open: min(440px, 34vw);
      }
      .week-tabs {
        scroll-snap-type: x proximity;
        justify-content: stretch;
        gap: 14px;
        padding-left: max(24px, env(safe-area-inset-left, 0px));
        padding-right: max(24px, env(safe-area-inset-right, 0px));
      }
      /* Closed days grow to fill the viewport — no giant black gutters */
      .day-tab:not(.is-open) {
        flex: 1 1 0;
        width: auto;
        min-width: 108px;
        max-width: 200px;
        scroll-snap-align: start;
      }
      .day-tab.is-open {
        flex: 0 0 var(--tab-open);
        width: var(--tab-open);
        max-width: none;
        scroll-snap-align: center;
      }
    }

    @media (min-width: 1200px) {
      .day-tab:not(.is-open) { max-width: 220px; }
      :root { --tab-open: min(480px, 32vw); }
    }

    .day-tab-toggle {
      appearance: none;
      width: 100%;
      border: none;
      background: linear-gradient(180deg, rgba(179, 154, 255, 0.1), transparent 70%);
      color: inherit;
      text-align: left;
      padding: 15px 14px 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-family: inherit;
    }

    .day-tab.is-today .day-tab-toggle {
      background: linear-gradient(180deg, rgba(139, 108, 255, 0.26), transparent 75%);
    }

    .day-tab-toggle:active { opacity: 0.92; }

    .tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .dow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .day-tab.is-today .dow { color: var(--purple); }

    .chev {
      width: 24px;
      height: 24px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .day-tab.is-open .chev {
      transform: rotate(90deg);
      color: var(--purple);
      border-color: var(--border-strong);
    }

    .dom {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .dom-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .dom-month {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .today-badge {
      display: none;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, var(--purple-deep), var(--blue-deep));
      padding: 3px 8px;
      border-radius: 999px;
    }
    .day-tab.is-today .today-badge { display: inline-block; }

    .count-pill {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(30, 30, 54, 0.9);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      width: fit-content;
    }
    .count-pill.has {
      color: var(--purple);
      border-color: var(--border-strong);
      background: var(--purple-soft);
    }

    .day-panel {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 0 14px;
      border-top: 1px solid transparent;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-4px);
      transition:
        max-height 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        padding 0.28s ease,
        border-color 0.22s;
      pointer-events: none;
    }
    .day-tab.is-open .day-panel {
      max-height: 720px;
      opacity: 1;
      transform: none;
      padding: 13px 14px 15px;
      border-top-color: var(--border);
      pointer-events: auto;
    }

    .empty-slot {
      text-align: center;
      padding: 22px 10px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(255, 255, 255, 0.06);
    }
    .empty-slot .dash {
      display: block;
      font-size: 18px;
      opacity: 0.35;
      margin-bottom: 4px;
      letter-spacing: 0.2em;
    }

    .event {
      display: flex;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .event::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--purple);
    }

    .event.color-blue::before { background: var(--blue); }
    .event.color-purple::before { background: var(--purple); }
    .event.color-blue { background: linear-gradient(90deg, var(--blue-soft), var(--surface-2) 42%); }
    .event.color-purple { background: linear-gradient(90deg, var(--purple-soft), var(--surface-2) 42%); }

    .event.is-link { cursor: pointer; }
    .event.is-link:active { transform: scale(0.985); }
    .event.is-link:hover {
      border-color: var(--border-strong);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .event-meta { flex: 1; min-width: 0; }

    .event-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-title {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.3;
      word-break: break-word;
    }

    .open-hint {
      font-size: 10px;
      font-weight: 700;
      color: var(--blue);
      margin-left: auto;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .tag-due { color: var(--danger); background: var(--danger-soft); }
    .tag-allday { color: var(--purple); background: var(--purple-soft); }
    .tag-toddle { color: var(--blue); background: var(--blue-soft); }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.55;
    }
    .footer strong { color: var(--text-muted); font-weight: 600; }


    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    .tt-btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: linear-gradient(135deg, rgba(139, 108, 255, 0.28), rgba(74, 158, 255, 0.22));
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(139, 108, 255, 0.28);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.12s, box-shadow 0.15s, border-color 0.15s;
    }
    .tt-btn:hover { border-color: var(--purple); box-shadow: 0 8px 26px rgba(139, 108, 255, 0.4); }
    .tt-btn:active { transform: scale(0.97); }
    .tt-btn .ico { font-size: 15px; line-height: 1; }

    .tt-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(4, 4, 12, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .tt-overlay.is-open { display: flex; }

    .tt-panel {
      width: min(720px, 100%);
      max-height: min(92dvh, 920px);
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(139, 108, 255, 0.28), transparent 55%),
        linear-gradient(180deg, #141428 0%, #0c0c1a 100%);
      border: 1px solid var(--border-strong);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: ttSlide 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (min-width: 720px) {
      .tt-overlay { align-items: center; padding: 24px; }
      .tt-panel { border-radius: 24px; max-height: min(88dvh, 860px); }
    }
    @keyframes ttSlide {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: none; }
    }

    .tt-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tt-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .tt-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.4;
    }
    .tt-close {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tt-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 18px 0;
      flex-shrink: 0;
    }
    .tt-cycle {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 30, 54, 0.8);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tt-cycle.is-active {
      color: #fff;
      background: linear-gradient(135deg, var(--purple-deep), var(--blue-deep));
      border-color: transparent;
      box-shadow: 0 4px 16px var(--purple-glow);
    }

    .tt-day-pills {
      display: flex;
      gap: 6px;
      padding: 12px 18px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .tt-day-pills::-webkit-scrollbar { display: none; }
    .tt-day-pill {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tt-day-pill.is-active {
      border-color: var(--border-strong);
      color: #fff;
      background: var(--purple-soft);
      box-shadow: 0 0 0 1px rgba(179, 154, 255, 0.25);
    }
    .tt-day-pill.is-today {
      border-color: var(--today-ring);
    }

    .tt-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 18px 22px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tt-body::-webkit-scrollbar { display: none; }

    .tt-period {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .tt-period:last-child { border-bottom: none; }
    .tt-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1.35;
      padding-top: 2px;
    }
    .tt-card {
      border-radius: 14px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
    }
    .tt-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--purple);
    }
    .tt-card.subj-break,
    .tt-card.subj-lunch,
    .tt-card.subj-free {
      background: rgba(255,255,255,0.03);
      border-style: dashed;
    }
    .tt-card.subj-break::before,
    .tt-card.subj-lunch::before,
    .tt-card.subj-free::before { background: var(--text-dim); }
    .tt-card.subj-sci::before { background: var(--blue); }
    .tt-card.subj-math::before { background: #f472b6; }
    .tt-card.subj-eng::before { background: #34d399; }
    .tt-card.subj-chi::before { background: #fbbf24; }
    .tt-card.subj-pe::before { background: #fb7185; }
    .tt-card.subj-design::before { background: #a78bfa; }
    .tt-card.subj-is::before { background: #60a5fa; }
    .tt-card.subj-arts::before { background: #c084fc; }
    .tt-card.subj-adv::before { background: #94a3b8; }

    .tt-subj {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .tt-meta {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }


    /* School work tasks */
    .sw-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 22px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .sw-body::-webkit-scrollbar { display: none; }

    .sw-task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      margin-bottom: 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
    }
    .sw-task::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--blue);
    }
    .sw-task.is-done {
      opacity: 0.72;
    }
    .sw-task.is-done::before { background: #22c55e; }
    .sw-task.is-bot-working::before { background: #38bdf8; }

    .sw-done {
      appearance: none;
      border: none;
      background: transparent;
      padding: 6px;
      margin: -6px;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .sw-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 4px 12px rgba(0,0,0,0.35);
      transition: background 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .sw-dot.is-red {
      background: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35), 0 4px 14px rgba(239, 68, 68, 0.45);
    }
    .sw-dot.is-green {
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35), 0 4px 14px rgba(34, 197, 94, 0.45);
    }
    .sw-done:active .sw-dot { transform: scale(0.9); }

    .sw-main {
      flex: 1;
      min-width: 0;
      text-align: left;
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
    }
    .sw-main.is-static { cursor: default; }
    .sw-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .sw-meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }
    .sw-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text-soft);
    }
    .sw-pill.is-due {
      border-color: rgba(251, 113, 133, 0.45);
      color: #fda4af;
      background: rgba(251, 113, 133, 0.12);
    }
    .sw-pill.is-overdue {
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }
    .sw-pill.is-toddle {
      border-color: rgba(74, 158, 255, 0.4);
      color: #93c5fd;
      background: rgba(74, 158, 255, 0.12);
    }

    .sw-bot {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 30, 54, 0.85);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .sw-bot-lamp {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.55);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .sw-bot.is-on {
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
      background: rgba(14, 165, 233, 0.18);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.2), 0 6px 18px rgba(14, 165, 233, 0.25);
    }
    .sw-bot.is-on .sw-bot-lamp {
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
    }
    .sw-empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    .status {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1 class="welcome">Welcome Jayden</h1>
          <p class="brand">Calander</p>
        </div>
        <span class="tz-pill">HKT</span>
      </div>

      <div class="week-nav">
        <button type="button" class="nav-btn" id="prevWeek" aria-label="Previous week">‹</button>
        <div class="week-label">
          <div class="range" id="weekRange">This week</div>
          <div class="hint" id="weekHint">Mon – Sun · Asia/Hong_Kong</div>
        </div>
        <button type="button" class="nav-btn" id="nextWeek" aria-label="Next week">›</button>
      </div>
      <div class="hero-actions">
        <button type="button" class="tt-btn" id="openTimetable" aria-haspopup="dialog">
          <span class="ico" aria-hidden="true">▦</span> School timetable
        </button>
        <button type="button" class="tt-btn" id="openSchoolWork" aria-haspopup="dialog">
          <span class="ico" aria-hidden="true">☑</span> School work
        </button>
        <button type="button" class="today-jump" id="jumpToday" style="margin:0">Jump to today</button>
      </div>
      <p class="hint-line">Tap a day to open · swipe on phone · scroll sideways</p>
    </header>
  </div>

  <div class="tt-overlay" id="ttOverlay" role="dialog" aria-modal="true" aria-labelledby="ttTitle" hidden>
    <div class="tt-panel">
      <div class="tt-head">
        <div>
          <div class="tt-title" id="ttTitle">School timetable</div>
          <div class="tt-sub" id="ttSub">Loading…</div>
        </div>
        <button type="button" class="tt-close" id="ttClose" aria-label="Close">×</button>
      </div>
      <div class="tt-tabs">
        <button type="button" class="tt-cycle" data-cycle="A">Week A</button>
        <button type="button" class="tt-cycle" data-cycle="B">Week B</button>
      </div>
      <div class="tt-day-pills" id="ttDayPills"></div>
      <div class="tt-body" id="ttBody"></div>
    </div>
  </div>


  <div class="tt-overlay" id="swOverlay" role="dialog" aria-modal="true" aria-labelledby="swTitle" hidden>
    <div class="tt-panel">
      <div class="tt-head">
        <div>
          <div class="tt-title" id="swTitle">School work</div>
          <div class="tt-sub" id="swSub">Tasks to do · red = not done · green = done · blue = bot working</div>
        </div>
        <button type="button" class="tt-close" id="swClose" aria-label="Close">×</button>
      </div>
      <div class="sw-body" id="swBody"></div>
    </div>
  </div>

  <div class="week-rail">
    <main class="week-tabs" id="weekTabs" aria-live="polite"></main>
  </div>

  <div class="shell">
    <p class="footer">
      Week tabs · data from <strong>events.json</strong><br />
      School items open Toddle when tapped.
    </p>
    <p class="status" id="status"></p>
  </div>

  <script>
    const TZ = "Asia/Hong_Kong";
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const TODDLE_DEFAULT = "https://web.toddleapp.com/platform/391418444458869835/todos";

    const EMBEDDED = {
      "timezone": "Asia/Hong_Kong",
      "updated": "2026-10-15T11:46:37+08:00",
      "toddleBase": TODDLE_DEFAULT,
      "events": [
        {"id":"food-design-crit-b-overdue","date":"2026-10-08","title":"Food Design Crit B","due":true,"overdue":true,"type":"school","color":"blue","url":TODDLE_DEFAULT},
        {"id":"pe-dragon-dance-2026-10-15","date":"2026-10-15","title":"PE dragon dance performance","allDay":true,"type":"personal","color":"purple"},
        {"id":"food-design-peer-2026-10-15","date":"2026-10-15","title":"Food Design peer feedback","time":"08:30","due":true,"type":"school","color":"blue","url":TODDLE_DEFAULT},
        {"id":"chinese-work-2026-10-15","date":"2026-10-15","title":"Chinese work","time":"15:30","due":true,"type":"school","color":"blue","url":TODDLE_DEFAULT},
        {"id":"holiday-2026-10-16","date":"2026-10-16","title":"Holiday","allDay":true,"type":"personal","color":"purple"},
        {"id":"chinese-reading-2026-10-16","date":"2026-10-16","title":"Chinese reading notes","time":"13:00","due":true,"type":"school","color":"blue","url":TODDLE_DEFAULT},
        {"id":"dragon-blog-2026-10-16","date":"2026-10-16","title":"Dragon dance blog","time":"17:00","due":true,"type":"school","color":"blue","url":TODDLE_DEFAULT},
        {"id":"food-design-crit-c-plan","date":"2026-10-15","title":"Food Design Crit C production plan","due":true,"type":"school","color":"blue","url":TODDLE_DEFAULT}
      ]
    };

    let eventsData = EMBEDDED;
    let weekStart = null;
    /** ymd -> open state; today defaults open */
    const openState = new Map();

    function hktParts(d = new Date()) {
      const fmt = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric", month: "2-digit", day: "2-digit",
        weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
      });
      const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
      return {
        y: +parts.year, m: +parts.month, d: +parts.day,
        weekday: parts.weekday,
        ymd: `${parts.year}-${parts.month}-${parts.day}`
      };
    }

    function parseYmd(ymd) {
      const [y, m, d] = ymd.split("-").map(Number);
      return { y, m, d };
    }

    function ymdFromParts(y, m, d) {
      return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }

    function addDaysYmd(ymd, n) {
      const { y, m, d } = parseYmd(ymd);
      const utc = new Date(Date.UTC(y, m - 1, d + n));
      return ymdFromParts(utc.getUTCFullYear(), utc.getUTCMonth() + 1, utc.getUTCDate());
    }

    function weekdayIndexMon0(ymd) {
      const { y, m, d } = parseYmd(ymd);
      const utc = new Date(Date.UTC(y, m - 1, d, 12));
      return (utc.getUTCDay() + 6) % 7;
    }

    function mondayOf(ymd) {
      return addDaysYmd(ymd, -weekdayIndexMon0(ymd));
    }

    function formatTime12(hhmm) {
      if (!hhmm) return "";
      const [h, mi] = hhmm.split(":").map(Number);
      const ampm = h >= 12 ? "PM" : "AM";
      const h12 = ((h + 11) % 12) + 1;
      return `${h12}:${String(mi).padStart(2,"0")} ${ampm}`;
    }

    function prettyRange(monYmd) {
      const sun = addDaysYmd(monYmd, 6);
      const a = parseYmd(monYmd);
      const b = parseYmd(sun);
      if (a.m === b.m && a.y === b.y) return `${MONTHS[a.m - 1]} ${a.d} – ${b.d}, ${a.y}`;
      if (a.y === b.y) return `${MONTHS[a.m - 1]} ${a.d} – ${MONTHS[b.m - 1]} ${b.d}, ${a.y}`;
      return `${MONTHS[a.m - 1]} ${a.d}, ${a.y} – ${MONTHS[b.m - 1]} ${b.d}, ${b.y}`;
    }

    function eventsForDate(ymd) {
      const list = (eventsData.events || []).filter(e => e.date === ymd);
      list.sort((a, b) => {
        if (a.allDay && !b.allDay) return -1;
        if (!a.allDay && b.allDay) return 1;
        return (a.time || "").localeCompare(b.time || "");
      });
      return list;
    }

    function eventUrl(ev) {
      return ev.url || ev.toddleUrl || "";
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function renderEvent(ev) {
      const color = ev.color === "blue" ? "color-blue" : "color-purple";
      const timeLabel = ev.allDay ? "All day" : formatTime12(ev.time);
      const href = eventUrl(ev);
      const tags = [];
      if (ev.due) tags.push('<span class="tag tag-due">Due</span>');
      if (ev.allDay) tags.push('<span class="tag tag-allday">All day</span>');
      if (href) tags.push('<span class="tag tag-toddle">Toddle</span>');
      const openHint = href ? '<span class="open-hint">Open ↗</span>' : "";
      const inner = `
          <div class="event-meta">
            <div class="event-time">${timeLabel}${openHint}</div>
            <div class="event-title">${escapeHtml(ev.title)}</div>
            ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
          </div>`;
      if (href) {
        return `<a class="event ${color} is-link" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
      }
      return `<article class="event ${color}">${inner}</article>`;
    }

    function isOpen(ymd, todayYmd) {
      if (openState.has(ymd)) return openState.get(ymd);
      return ymd === todayYmd;
    }

    function renderWeek(opts) {
      const today = hktParts().ymd;
      const root = document.getElementById("weekTabs");
      const days = [];
      for (let i = 0; i < 7; i++) {
        const ymd = addDaysYmd(weekStart, i);
        const { m, d } = parseYmd(ymd);
        const isToday = ymd === today;
        const open = isOpen(ymd, today);
        const evs = eventsForDate(ymd);
        const body = evs.length
          ? evs.map(renderEvent).join("")
          : `<div class="empty-slot"><span class="dash">— — —</span>Nothing scheduled</div>`;
        const countLabel = evs.length === 0 ? "Empty" : (evs.length === 1 ? "1 item" : `${evs.length} items`);
        days.push(`
          <section class="day-tab ${isToday ? "is-today" : ""} ${open ? "is-open" : ""}" data-date="${ymd}">
            <button type="button" class="day-tab-toggle" aria-expanded="${open}" data-toggle="${ymd}">
              <div class="tab-top">
                <span class="dow">${DOW[i]}</span>
                <span class="chev" aria-hidden="true">›</span>
              </div>
              <div class="dom">
                <span class="dom-num">${d}</span>
                <span class="dom-month">${MONTHS[m - 1]}</span>
                <span class="today-badge">Today</span>
              </div>
              <span class="count-pill ${evs.length ? "has" : ""}">${countLabel}</span>
            </button>
            <div class="day-panel">${body}</div>
          </section>`);
      }
      root.innerHTML = days.join("");
      document.getElementById("weekRange").textContent = prettyRange(weekStart);
      document.getElementById("weekHint").textContent = "Mon – Sun · Asia/Hong_Kong";

      root.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          // If a drag just happened, the capture-phase blocker handles it;
          // this is a normal mouse/touch click → expand / collapse.
          ev.stopPropagation();
          const ymd = btn.getAttribute("data-toggle");
          const next = !isOpen(ymd, today);
          openState.set(ymd, next);
          // Toggle class in-place for smoother open/close (avoid full re-render flicker)
          const tab = btn.closest(".day-tab");
          if (tab) {
            tab.classList.toggle("is-open", next);
            btn.setAttribute("aria-expanded", String(next));
          } else {
            renderWeek();
          }
          requestAnimationFrame(() => {
            const el = root.querySelector(`[data-date="${ymd}"]`);
            if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
          });
        });
      });

      requestAnimationFrame(() => {
        if (opts && opts.preferScroll === "start") {
          const first = root.querySelector(".day-tab");
          if (first) first.scrollIntoView({ inline: "start", block: "nearest", behavior: "smooth" });
          return;
        }
        const el = root.querySelector(".is-today.is-open") || root.querySelector(".is-today");
        if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      });
    }

    async function loadEvents() {
      const status = document.getElementById("status");
      try {
        const res = await fetch("events.json", { cache: "no-store" });
        if (!res.ok) throw new Error("bad status");
        eventsData = await res.json();
        status.textContent = `Updated ${eventsData.updated || ""}`.trim();
      } catch {
        eventsData = EMBEDDED;
        status.textContent = "Using offline / built-in events";
      }
    }

    function initWeek() {
      weekStart = mondayOf(hktParts().ymd);
      openState.clear();
    }

    function changeWeek(deltaDays, driftDir) {
      const root = document.getElementById("weekTabs");
      weekStart = addDaysYmd(weekStart, deltaDays);
      openState.clear();
      root.classList.add("is-week-changing");
      root.classList.remove("week-drift-next", "week-drift-prev");
      // Force reflow so the next animation always plays
      void root.offsetWidth;
      if (driftDir === "next") root.classList.add("week-drift-next");
      if (driftDir === "prev") root.classList.add("week-drift-prev");
      renderWeek({ preferScroll: "start" });
      requestAnimationFrame(() => {
        const first = root.querySelector(".day-tab");
        if (first) first.scrollIntoView({ inline: "start", block: "nearest", behavior: "smooth" });
        window.setTimeout(() => {
          root.classList.remove("is-week-changing", "week-drift-next", "week-drift-prev");
        }, 480);
      });
    }

    document.getElementById("prevWeek").addEventListener("click", () => changeWeek(-7, "prev"));
    document.getElementById("nextWeek").addEventListener("click", () => changeWeek(7, "next"));
    document.getElementById("jumpToday").addEventListener("click", () => {
      weekStart = mondayOf(hktParts().ymd);
      openState.clear();
      const root = document.getElementById("weekTabs");
      root.classList.add("is-week-changing");
      root.classList.remove("week-drift-next", "week-drift-prev");
      void root.offsetWidth;
      root.classList.add("week-drift-prev");
      renderWeek();
      window.setTimeout(() => {
        root.classList.remove("is-week-changing", "week-drift-next", "week-drift-prev");
      }, 480);
    });


    // Drag-to-scroll: touch uses native momentum.
    // Mouse/pen only become a drag after >8px movement so plain clicks still expand days.
    (function enableDragScroll() {
      const el = document.getElementById("weekTabs");
      if (!el) return;
      const THRESHOLD = 8;
      let tracking = false;
      let dragging = false;
      let startX = 0;
      let startScroll = 0;
      let pointerId = null;
      let captured = false;

      el.addEventListener("pointerdown", (e) => {
        // Let touch scroll natively — never steal it
        if (e.pointerType === "touch") return;
        if (e.button !== 0) return;
        // Ignore if the press started on a link (Toddle)
        if (e.target.closest && e.target.closest("a")) return;
        tracking = true;
        dragging = false;
        captured = false;
        startX = e.clientX;
        startScroll = el.scrollLeft;
        pointerId = e.pointerId;
        // Do NOT setPointerCapture yet — that was stealing clicks from day toggles
      });

      el.addEventListener("pointermove", (e) => {
        if (!tracking || e.pointerId !== pointerId) return;
        const dx = e.clientX - startX;
        if (!dragging && Math.abs(dx) > THRESHOLD) {
          dragging = true;
          el.classList.add("is-dragging");
          try {
            el.setPointerCapture(pointerId);
            captured = true;
          } catch (_) {}
        }
        if (dragging) {
          el.scrollLeft = startScroll - dx;
          e.preventDefault();
        }
      });

      function endDrag(e) {
        if (!tracking || (e && e.pointerId !== pointerId)) return;
        tracking = false;
        el.classList.remove("is-dragging");
        if (captured) {
          try { el.releasePointerCapture(pointerId); } catch (_) {}
        }
        if (dragging) {
          // Swallow only the click that follows a real drag
          const block = (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
            el.removeEventListener("click", block, true);
          };
          el.addEventListener("click", block, true);
          // Safety: remove blocker if no click comes
          window.setTimeout(() => el.removeEventListener("click", block, true), 400);
        }
        dragging = false;
        captured = false;
        pointerId = null;
      }
      el.addEventListener("pointerup", endDrag);
      el.addEventListener("pointercancel", endDrag);
      el.addEventListener("lostpointercapture", () => {
        tracking = false;
        dragging = false;
        captured = false;
        el.classList.remove("is-dragging");
      });
    })();


    // —— School timetable (fortnightly Week A/B) ——
    const SUBJECT_PLAIN = {
      "Advisory": "Advisory",
      "Sciences": "Science",
      "Chinese Language Acquisition - Phase 4": "Chinese",
      "Individuals and Societies": "Individuals & Societies",
      "Physical Education": "PE",
      "Physical and Health Education": "PE / Health",
      "Mathematics": "Math",
      "Arts - Theatre Arts": "Theatre Arts",
      "English Language and Literature": "English",
      "Food Design": "Food Design",
      "Personal and Social Education": "Personal & Social Ed",
      "Break": "Break",
      "Lunch": "Lunch",
      "No lesson": "No lesson"
    };

    function plainSubject(s) {
      return SUBJECT_PLAIN[s] || s;
    }

    function subjectClass(s) {
      const p = plainSubject(s).toLowerCase();
      if (s === "Break") return "subj-break";
      if (s === "Lunch") return "subj-lunch";
      if (s === "No lesson") return "subj-free";
      if (p.includes("science")) return "subj-sci";
      if (p.includes("math")) return "subj-math";
      if (p.includes("english")) return "subj-eng";
      if (p.includes("chinese")) return "subj-chi";
      if (p.includes("pe")) return "subj-pe";
      if (p.includes("food") || p.includes("design")) return "subj-design";
      if (p.includes("individual")) return "subj-is";
      if (p.includes("theatre") || p.includes("arts")) return "subj-arts";
      if (p.includes("advisory")) return "subj-adv";
      if (p.includes("personal")) return "subj-adv";
      return "";
    }

    function formatClock(hhmm) {
      if (!hhmm) return "";
      const [h, mi] = hhmm.split(":").map(Number);
      const ampm = h >= 12 ? "PM" : "AM";
      const h12 = ((h + 11) % 12) + 1;
      return `${h12}:${String(mi).padStart(2,"0")} ${ampm}`;
    }

    let timetableData = null;
    let ttCycle = "B";
    let ttDay = "Thu";

    function inferCycleAndDay(data) {
      const today = hktParts().ymd;
      const hit = (data.days || []).find(d => d.date === today);
      if (hit) return { cycle: hit.cycle, day: hit.day };
      // fallback: match weekday within most recent cycle dates
      const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(today + "T12:00:00+08:00").getDay()];
      const map = { Mon: "Mon", Tue: "Tue", Wed: "Wed", Thu: "Thu", Fri: "Fri", Sat: "Mon", Sun: "Mon" };
      const day = map[wd] || "Mon";
      // prefer B if today is in week of Oct 12-16 2026 pattern: use asOf week
      const asOf = data.asOf || today;
      const asOfHit = (data.days || []).find(d => d.date === asOf);
      return { cycle: asOfHit ? asOfHit.cycle : "B", day };
    }

    function openTimetable() {
      const ov = document.getElementById("ttOverlay");
      ov.hidden = false;
      ov.classList.add("is-open");
      document.body.style.overflow = "hidden";
      renderTimetable();
    }

    function closeTimetable() {
      const ov = document.getElementById("ttOverlay");
      ov.classList.remove("is-open");
      ov.hidden = true;
      document.body.style.overflow = "";
    }

    function renderTimetable() {
      if (!timetableData) {
        document.getElementById("ttSub").textContent = "Couldn’t load timetable";
        document.getElementById("ttBody").innerHTML = `<div class="empty-slot">No timetable data</div>`;
        return;
      }
      const today = hktParts().ymd;
      const days = (timetableData.days || []).filter(d => d.cycle === ttCycle);
      document.querySelectorAll(".tt-cycle").forEach(btn => {
        btn.classList.toggle("is-active", btn.getAttribute("data-cycle") === ttCycle);
      });
      const pills = document.getElementById("ttDayPills");
      pills.innerHTML = days.map(d => {
        const isToday = d.date === today;
        const active = d.day === ttDay;
        return `<button type="button" class="tt-day-pill ${active ? "is-active" : ""} ${isToday ? "is-today" : ""}" data-day="${d.day}">${d.day}${d.cycle}${isToday ? " · today" : ""}</button>`;
      }).join("");
      pills.querySelectorAll("[data-day]").forEach(btn => {
        btn.addEventListener("click", () => {
          ttDay = btn.getAttribute("data-day");
          renderTimetable();
        });
      });

      const dayObj = days.find(d => d.day === ttDay) || days[0];
      if (!dayObj) {
        document.getElementById("ttBody").innerHTML = `<div class="empty-slot">No school day</div>`;
        return;
      }
      const label = `Week ${ttCycle} · ${dayObj.day}${ttCycle}`;
      const dateBits = parseYmd(dayObj.date);
      document.getElementById("ttSub").textContent =
        `${label} · ${MONTHS[dateBits.m - 1]} ${dateBits.d} · Mon–Fri · from Toddle / Sentral`;

      const body = document.getElementById("ttBody");
      body.innerHTML = (dayObj.periods || []).map(p => {
        const name = plainSubject(p.subject);
        const cls = subjectClass(p.subject);
        const meta = [];
        if (p.room) meta.push(`Room ${escapeHtml(p.room)}`);
        if (p.teacher) meta.push(escapeHtml(p.teacher));
        if (p.classCode && p.subject !== "Break" && p.subject !== "Lunch" && p.subject !== "No lesson") {
          /* keep codes out of plain title; optional quiet code */
        }
        return `<div class="tt-period">
          <div class="tt-time">${formatClock(p.start)}<br/>${formatClock(p.end)}</div>
          <div class="tt-card ${cls}">
            <div class="tt-subj">${escapeHtml(name)}</div>
            ${meta.length ? `<div class="tt-meta">${meta.join(" · ")}</div>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    async function loadTimetable() {
      try {
        const res = await fetch("timetable.json", { cache: "no-store" });
        if (!res.ok) throw new Error("bad");
        timetableData = await res.json();
      } catch {
        timetableData = null;
      }
      if (timetableData) {
        const inf = inferCycleAndDay(timetableData);
        ttCycle = inf.cycle;
        ttDay = inf.day;
      }
    }



    // —— School work tasks ——
    const SW_DONE_KEY = "jayden-cal-school-done";
    const SW_BOT_KEY = "jayden-cal-school-bot";

    function loadSwMap(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return {};
        const obj = JSON.parse(raw);
        return obj && typeof obj === "object" ? obj : {};
      } catch {
        return {};
      }
    }

    function saveSwMap(key, map) {
      try { localStorage.setItem(key, JSON.stringify(map)); } catch (_) {}
    }

    let swDone = loadSwMap(SW_DONE_KEY);
    let swBot = loadSwMap(SW_BOT_KEY);
    /** server-authoritative working map: id -> { working, bot, done } */
    let swServer = {};
    let swBotConfig = { webhookUrl: "", webhookKey: "", ntfyTopic: "" };
    let swPollTimer = null;
    let swStatusNote = "";
    const swBotInFlight = new Set();

    function schoolTasks() {
      const list = (eventsData.events || []).filter(e => e.type === "school");
      const today = hktParts().ymd;
      list.sort((a, b) => {
        const ao = !!(a.overdue || (a.date && a.date < today));
        const bo = !!(b.overdue || (b.date && b.date < today));
        if (ao !== bo) return ao ? -1 : 1;
        const dc = (a.date || "").localeCompare(b.date || "");
        if (dc) return dc;
        return (a.time || "").localeCompare(b.time || "");
      });
      return list;
    }

    function formatTaskDue(ev) {
      const bits = [];
      const today = hktParts().ymd;
      const overdue = !!(ev.overdue || (ev.date && ev.date < today));
      if (overdue) bits.push('<span class="sw-pill is-overdue">Overdue</span>');
      else if (ev.due) bits.push('<span class="sw-pill is-due">Due</span>');
      if (ev.date) {
        const { m, d } = parseYmd(ev.date);
        let label = `${MONTHS[m - 1]} ${d}`;
        if (ev.time) label += ` · ${formatTime12(ev.time)}`;
        else if (ev.allDay) label += " · All day";
        bits.push(`<span>${label}</span>`);
      } else if (ev.time) {
        bits.push(`<span>${formatTime12(ev.time)}</span>`);
      }
      if (eventUrl(ev)) bits.push('<span class="sw-pill is-toddle">Toddle</span>');
      const srv = swServer[ev.id];
      if (srv && srv.working && srv.bot) {
        bits.push(`<span class="sw-pill is-toddle">${escapeHtml(String(srv.bot))}</span>`);
      }
      return bits.join("");
    }

    function isTaskDone(id) {
      if (swServer[id] && swServer[id].done === true) return true;
      return !!swDone[id];
    }

    function isBotWorking(id) {
      // Server working wins when we have a server entry for this id
      if (Object.prototype.hasOwnProperty.call(swServer, id)) {
        return !!swServer[id].working;
      }
      return !!swBot[id];
    }

    async function fetchSchoolBotConfig() {
      try {
        const res = await fetch(`school-bot-config.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("config");
        const data = await res.json();
        swBotConfig = {
          webhookUrl: (data && data.webhookUrl) ? String(data.webhookUrl) : "",
          webhookKey: (data && data.webhookKey) ? String(data.webhookKey) : "",
          ntfyTopic: (data && data.ntfyTopic) ? String(data.ntfyTopic) : ""
        };
      } catch {
        swBotConfig = { webhookUrl: "", webhookKey: "", ntfyTopic: "" };
      }
    }

    async function fetchSchoolStatus() {
      try {
        const res = await fetch(`school-status.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("status");
        const data = await res.json();
        const tasks = (data && data.tasks && typeof data.tasks === "object") ? data.tasks : {};
        const next = {};
        for (const [id, info] of Object.entries(tasks)) {
          if (!info || typeof info !== "object") continue;
          next[id] = {
            working: !!info.working,
            bot: info.bot || null,
            done: !!info.done
          };
          // Mirror server working into local cache so offline still shows last known
          swBot[id] = !!info.working;
          if (info.done === true) swDone[id] = true;
        }
        swServer = next;
        saveSwMap(SW_BOT_KEY, swBot);
        saveSwMap(SW_DONE_KEY, swDone);
        return true;
      } catch {
        return false;
      }
    }

    function openSchoolWork() {
      const ov = document.getElementById("swOverlay");
      ov.hidden = false;
      ov.classList.add("is-open");
      document.body.style.overflow = "hidden";
      swStatusNote = "";
      renderSchoolWork();
      (async () => {
        await fetchSchoolBotConfig();
        await fetchSchoolStatus();
        if (!(swBotConfig.ntfyTopic || swBotConfig.webhookUrl)) {
          swStatusNote = "Bot requests aren’t connected yet — tell Calander.";
        }
        if (document.getElementById("swOverlay").classList.contains("is-open")) {
          renderSchoolWork();
        }
      })();
      if (swPollTimer) clearInterval(swPollTimer);
      swPollTimer = setInterval(async () => {
        if (!document.getElementById("swOverlay").classList.contains("is-open")) return;
        const ok = await fetchSchoolStatus();
        if (ok) renderSchoolWork();
      }, 8000);
    }

    function closeSchoolWork() {
      const ov = document.getElementById("swOverlay");
      ov.classList.remove("is-open");
      ov.hidden = true;
      document.body.style.overflow = "";
      if (swPollTimer) {
        clearInterval(swPollTimer);
        swPollTimer = null;
      }
    }

    function renderSchoolWork() {
      const tasks = schoolTasks();
      const doneCount = tasks.filter(t => isTaskDone(t.id)).length;
      const botCount = tasks.filter(t => isBotWorking(t.id)).length;
      const sub = document.getElementById("swSub");
      let base;
      if (!tasks.length) {
        base = "No school tasks yet";
      } else {
        base = `${tasks.length} task${tasks.length === 1 ? "" : "s"} · ${doneCount} done · ${botCount} bot working`;
      }
      sub.textContent = swStatusNote ? `${base} · ${swStatusNote}` : base;
      const body = document.getElementById("swBody");
      if (!tasks.length) {
        body.innerHTML = `<div class="sw-empty">No school work tasks right now</div>`;
        return;
      }
      body.innerHTML = tasks.map(ev => {
        const done = isTaskDone(ev.id);
        const bot = isBotWorking(ev.id);
        const busy = swBotInFlight.has(ev.id);
        const href = eventUrl(ev);
        const rowCls = ["sw-task"];
        if (done) rowCls.push("is-done");
        if (bot) rowCls.push("is-bot-working");
        const mainInner = `<div class="sw-title">${escapeHtml(ev.title)}</div><div class="sw-meta">${formatTaskDue(ev)}</div>`;
        const main = href
          ? `<a class="sw-main" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${mainInner}</a>`
          : `<div class="sw-main is-static">${mainInner}</div>`;
        return `<div class="${rowCls.join(" ")}" data-sw-id="${escapeAttr(ev.id)}">
          <button type="button" class="sw-done" data-sw-done="${escapeAttr(ev.id)}" aria-label="${done ? "Mark not done" : "Mark done"}" title="${done ? "Done" : "Not done"}">
            <span class="sw-dot ${done ? "is-green" : "is-red"}" aria-hidden="true"></span>
          </button>
          ${main}
          <button type="button" class="sw-bot ${bot ? "is-on" : ""}" data-sw-bot="${escapeAttr(ev.id)}" aria-pressed="${bot ? "true" : "false"}" aria-label="${bot ? "Stop bot" : "Bot working"}" title="Bot working" ${busy ? "disabled" : ""}>
            <span class="sw-bot-lamp" aria-hidden="true"></span>
            Bot
          </button>
        </div>`;
      }).join("");

      body.querySelectorAll("[data-sw-done]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.getAttribute("data-sw-done");
          const next = !isTaskDone(id);
          swDone[id] = next;
          // If server had done:true and user marks not done, keep local false until server updates
          if (swServer[id]) swServer[id].done = next;
          saveSwMap(SW_DONE_KEY, swDone);
          renderSchoolWork();
        });
      });
      body.querySelectorAll("[data-sw-bot]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.getAttribute("data-sw-bot");
          requestBotToggle(id);
        });
      });
    }

    async function requestBotToggle(id) {
      if (swBotInFlight.has(id)) return;
      const ev = (eventsData.events || []).find(e => e.id === id) || { id, title: id };
      const currently = isBotWorking(id);
      const next = !currently;
      const action = next ? "start" : "stop";

      // Optimistic UI
      swBot[id] = next;
      if (swServer[id]) {
        swServer[id].working = next;
      } else {
        swServer[id] = { working: next, bot: null, done: !!swDone[id] };
      }
      saveSwMap(SW_BOT_KEY, swBot);
      swBotInFlight.add(id);
      swStatusNote = "";
      renderSchoolWork();

      const ntfyTopic = (swBotConfig.ntfyTopic || "").trim();
      const webhookUrl = (swBotConfig.webhookUrl || "").trim();
      if (!ntfyTopic && !webhookUrl) {
        swStatusNote = "Bot requests aren’t connected yet — tell Calander.";
        swBotInFlight.delete(id);
        renderSchoolWork();
        return;
      }

      const payload = {
        action,
        id: ev.id,
        title: ev.title || "",
        date: ev.date || "",
        time: ev.time || "",
        url: eventUrl(ev) || "",
        source: "calander-site"
      };

      try {
        let res;
        if (ntfyTopic) {
          res = await fetch(`https://ntfy.sh/${encodeURIComponent(ntfyTopic)}`, {
            method: "POST",
            headers: {
              "Title": "calander-bot",
              "Tags": "schoolwork",
              "Content-Type": "text/plain"
            },
            body: JSON.stringify(payload),
            mode: "cors"
          });
        } else {
          const headers = { "Content-Type": "application/json" };
          const key = (swBotConfig.webhookKey || "").trim();
          if (key) headers["Authorization"] = `Bearer ${key}`;
          res = await fetch(webhookUrl, {
            method: "POST",
            headers,
            body: JSON.stringify(payload),
            mode: "cors"
          });
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        swStatusNote = next
          ? (ntfyTopic ? "Requested — bot starting soon" : "Bot request sent")
          : (ntfyTopic ? "Stop requested" : "Stop request sent");
        // Refresh server status soon
        setTimeout(() => { fetchSchoolStatus().then(() => {
          if (document.getElementById("swOverlay").classList.contains("is-open")) renderSchoolWork();
        }); }, 1200);
      } catch (err) {
        // Revert optimistic state
        swBot[id] = currently;
        if (swServer[id]) swServer[id].working = currently;
        saveSwMap(SW_BOT_KEY, swBot);
        swStatusNote = "Bot request failed — try again";
      } finally {
        swBotInFlight.delete(id);
        renderSchoolWork();
        // Clear brief status after a few seconds unless it's the disconnected note
        if (swStatusNote && !swStatusNote.includes("aren’t connected")) {
          const note = swStatusNote;
          setTimeout(() => {
            if (swStatusNote === note) {
              swStatusNote = "";
              if (document.getElementById("swOverlay").classList.contains("is-open")) renderSchoolWork();
            }
          }, 3500);
        }
      }
    }

    document.getElementById("openSchoolWork").addEventListener("click", openSchoolWork);
    document.getElementById("swClose").addEventListener("click", closeSchoolWork);
    document.getElementById("swOverlay").addEventListener("click", (e) => {
      if (e.target.id === "swOverlay") closeSchoolWork();
    });


    document.getElementById("openTimetable").addEventListener("click", openTimetable);
    document.getElementById("ttClose").addEventListener("click", closeTimetable);
    document.getElementById("ttOverlay").addEventListener("click", (e) => {
      if (e.target.id === "ttOverlay") closeTimetable();
    });
    document.querySelectorAll(".tt-cycle").forEach(btn => {
      btn.addEventListener("click", () => {
        ttCycle = btn.getAttribute("data-cycle");
        const days = (timetableData?.days || []).filter(d => d.cycle === ttCycle);
        if (!days.find(d => d.day === ttDay) && days[0]) ttDay = days[0].day;
        renderTimetable();
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (document.getElementById("swOverlay").classList.contains("is-open")) {
        closeSchoolWork();
        return;
      }
      if (document.getElementById("ttOverlay").classList.contains("is-open")) {
        closeTimetable();
      }
    });

    (async () => {
      initWeek();
      await Promise.all([loadEvents(), loadTimetable()]);
      renderWeek();
      if (new URLSearchParams(location.search).has("tt")) {
        openTimetable();
      }
      if (new URLSearchParams(location.search).has("sw")) {
        openSchoolWork();
      }
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        // Force fresh sw.js fetch; network-first HTML so polish updates aren't stuck
        navigator.serviceWorker.register("./sw.js?v=8", { updateViaCache: "none" })
          .then((reg) => { try { reg.update(); } catch (_) {} })
          .catch(() => {});
        // One-time hard refresh when a new SW takes control (clears stale cached shell)
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          if (sessionStorage.getItem("cal-sw-reloaded") === "1") return;
          refreshing = true;
          sessionStorage.setItem("cal-sw-reloaded", "1");
          location.reload();
        });
        // Allow a later update cycle to reload again next visit
        setTimeout(() => { try { sessionStorage.removeItem("cal-sw-reloaded"); } catch (_) {} }, 15000);
      }
    })();
  </script>
